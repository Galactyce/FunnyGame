<!DOCTYPE html>
<html>
    <head>

        <meta name="viewport"

        <link rel="stylesheet" type="text/css" href="game-layout.css"/>
        <script src="LAB.min.js"></script>
        <script>

            var powerupjsdir = 'powerupjs/';
                $LAB.setOptions({ UseLocalXHR: false });

            $LAB

                    .script(powerupjsdir + 'input/ButtonState.js').wait()
                    .script(powerupjsdir + 'input/Keyboard.js').wait()
                    .script(powerupjsdir + 'input/Mouse.js').wait()
                    .script(powerupjsdir + 'input/Touch.js').wait()
                    .script(powerupjsdir + 'SpriteSheet.js').wait()

                    .script(powerupjsdir + 'Animation.js').wait()

                    .script(powerupjsdir + 'gui/Label.js').wait()
                    .script(powerupjsdir + 'GameStateManager.js').wait()
                    .script(powerupjsdir + 'Game.js').wait()
                    .script(powerupjsdir + 'Camera.js').wait()
                    .script('TileDataManager.js').wait()                    
                    .script('Main.js').wait()
                    .script('WorldSettings.js').wait()
                    .script('LevelData.js').wait()
                    .script('dataStorage.js').wait()
                    .script('AttackManager.js').wait()
                    .script('gui/LabelledButton.js').wait()
                    .script('gui/ObjectMenuGUI.js').wait()
                    .script('gui/EditingMenuGUI.js').wait()
                    .script('gui/ArrowButton.js').wait()

                    .script('game objects/EventNode.js').wait()
                    .script('game objects/MusicManager.js').wait()

                    .script('game objects/TravelPoint.js').wait()
                    .script('game objects/Room.js').wait()
                    .script('game objects/Level.js').wait()
                    .script('game objects/TileField.js').wait()
                    .script('PlayerProperties.js').wait()
                    .script('game objects/Player.js').wait()
                    .script('game states/PlayingState.js').wait()
                    .script('game states/TitleMenuState.js').wait()
                    .script('game states/GameplayEditorState.js').wait()
                    .script('Main.js').wait(function() {
                        powerupjs.Game.start('gameArea', 'mycanvas', 1440, 825);
                    });

        </script>
                     
        <title>Bitshift</title>
    </head>

    <body>
        <div id="gameArea">
            <canvas id="mycanvas">Your browser doesn't support canvas tag</canvas>
            <section id="debugArea" aria-label="Runtime debug area"></section>
        </div>
        
    </body>
</html>
